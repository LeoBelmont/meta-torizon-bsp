#@TYPE: Machine
#@NAME: ConnectTech Rudi-NX (Jetson Orin Nano / NGX010)
#@DESCRIPTION: ConnectTech Rudi-NX embedded system, Jetson Orin Nano module, NVMe boot

require conf/machine/include/orin-nano.inc
require conf/machine/include/tegra-torizon.inc

# Orin Nano variant of the ConnectTech Rudi-NX (NGX010) carrier. Identical to
# rudi-nx.conf except for the module: the Orin Nano needs its own carrier kernel
# DTB. All CTI BCT/pinmux/overlay and the Torizon behaviour are shared with the
# Orin NX variant. Values taken from the CTI r39.2 BSP
# (conf/cti/orin-nano/rudi-nx/base.conf + cti-orin-nx.conf.common).
TNSPEC_BOOTDEV = "nvme0n1p1"

# orin-nano.inc does not set the QSPI partition-layout template (only the full
# devkit machine confs do), so set it here; the external NVMe layout comes from
# tegra234.inc.
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

KERNEL_DEVICETREE = "tegra234-orin-nano-cti-NGX010.dtb"
PREFERRED_PROVIDER_virtual/dtb = "cti-rudi-nx-dtb"

TEGRA_FLASHVAR_PINMUX_CONFIG  = "tegra234-cti-orin-nx-rudi-mb1-bct-pinmux.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG     = "tegra234-mb1-bct-padvoltage-p3767-dp-a03.dtsi"
TEGRA_FLASHVAR_MISC_CONFIG    = "tegra234-cti-orin-nx-mb2-bct-misc.dts"
TEGRA_FLASHVAR_SCR_CONFIG     = "tegra234-cti-orin-nx-mb2-bct-scr.dts"
TEGRA_FLASHVAR_GPIOINT_CONFIG = "tegra234-cti-orin-nx-mb1-bct-gpioint.dts"

OVERLAY_DTB_FILE = "L4TConfiguration.dtbo,tegra234-carveouts.dtbo,tegra-optee.dtbo,tegra234-orin-nx-cti-overlay.dtbo,tegra234-dcb-p3767-0000-hdmi.dtbo"

# Inject the HDMI DCB into the DCE (Display Control Engine) firmware, not just
# the kernel DTB above. On Orin the DCE co-processor owns display bring-up and
# reads its own DCB; without this it keeps the default DisplayPort DCB and finds
# no head on the HDMI-only Rudi-NX carrier ("Cannot find any crtc or sizes"),
# which freezes the splash. Matches CTI's DCE_OVERLAY_DTB_FILE for the NGX010.
TEGRA_FLASHVAR_DCE_OVERLAY = "tegra234-dcb-p3767-0000-hdmi.dtbo"

# The CTI carrier BCT/pinmux/DTB files are injected into the flash staging by
# the tegra-bootfiles bbappend (scoped :rudi-nx-nano). The kernel device tree is
# a prebuilt CTI blob (not in the OOT kernel source), so it is supplied by the
# cti-rudi-nx-dtb recipe (PROVIDES virtual/dtb) instead of being built.
