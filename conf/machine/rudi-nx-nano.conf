#@TYPE: Machine
#@NAME: ConnectTech Rudi-NX with Jetson Orin Nano module (NGX010)
#@DESCRIPTION: ConnectTech Rudi-NX embedded system, Jetson Orin Nano module, NVMe boot

require conf/machine/include/orin-nano.inc
require conf/machine/include/tegra-torizon.inc

# Same Rudi-NX (NGX010) carrier as rudi-nx.conf, but populated with an Orin Nano
# module instead of Orin NX. The Orin NX and Orin Nano modules are pin-compatible
# in the same SO-DIMM socket, and CTI supports both on this carrier
# (conf/cti/orin-nano/rudi-nx/base.conf). The carrier is identical, so the
# pinmux/BCT are the same shared CTI files as rudi-nx; only the module config
# (orin-nano.inc: SDRAM/SKU/BPMP) and the kernel device tree differ.
TNSPEC_BOOTDEV = "nvme0n1p1"

# The Orin NX/Nano SoC includes don't set the flash partition layout (the full
# NVIDIA devkit machine confs do), so set the NVMe-boot layout here as the
# devkit-nvme machine does: internal QSPI bootloader layout + external NVMe
# rootfs. Without PARTITION_LAYOUT_TEMPLATE_DEFAULT, tegra-storage-layout fails
# to expand PARTITION_LAYOUT_TEMPLATE_REDUNDANT.
PARTITION_LAYOUT_TEMPLATE_DEFAULT ?= "flash_t234_qspi.xml"
PARTITION_LAYOUT_TEMPLATE_DEFAULT_SUPPORTS_REDUNDANT ?= "1"
PARTITION_LAYOUT_EXTERNAL_DEFAULT ?= "flash_l4t_t234_nvme.xml"

KERNEL_DEVICETREE = "tegra234-orin-nano-cti-NGX010.dtb"
PREFERRED_PROVIDER_virtual/dtb = "cti-rudi-nx-dtb"

TEGRA_FLASHVAR_PINMUX_CONFIG  = "tegra234-cti-orin-nx-rudi-mb1-bct-pinmux.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG     = "tegra234-mb1-bct-padvoltage-p3767-dp-a03.dtsi"
TEGRA_FLASHVAR_MISC_CONFIG    = "tegra234-cti-orin-nx-mb2-bct-misc.dts"
TEGRA_FLASHVAR_SCR_CONFIG     = "tegra234-cti-orin-nx-mb2-bct-scr.dts"
TEGRA_FLASHVAR_GPIOINT_CONFIG = "tegra234-cti-orin-nx-mb1-bct-gpioint.dts"

OVERLAY_DTB_FILE = "L4TConfiguration.dtbo,tegra234-carveouts.dtbo,tegra-optee.dtbo,tegra234-orin-nx-cti-overlay.dtbo,tegra234-dcb-p3767-0000-hdmi.dtbo"

# The CTI carrier BCT/pinmux/DTB files are injected into the flash staging by
# the tegra-bootfiles bbappend (scoped :rudi-nx-nano). The kernel device tree is
# a prebuilt CTI blob supplied by the cti-rudi-nx-dtb recipe (PROVIDES
# virtual/dtb), which selects the Orin Nano NGX010 dtb for this machine.
